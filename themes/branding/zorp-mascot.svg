<?xml version="1.0" encoding="UTF-8"?>
<!-- "Zorp" - original ZorpOS mascot. Drawn from scratch for this project. CC-BY-SA-4.0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="aura" cx="50%" cy="58%" r="50%">
      <stop offset="0" stop-color="#a6ff2e" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#2fd3d0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2fd3d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="40%" cy="38%" r="70%">
      <stop offset="0" stop-color="#e2d6ff"/>
      <stop offset="0.35" stop-color="#c9b3ff"/>
      <stop offset="0.75" stop-color="#8e6bd8"/>
      <stop offset="1" stop-color="#4a2f86"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd3d0" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#2fd3d0" stop-opacity="0"/>
      <stop offset="1" stop-color="#8ff7f0" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="0.45" stop-color="#c4ced8"/>
      <stop offset="0.55" stop-color="#7d8a99"/>
      <stop offset="0.8" stop-color="#c4ced8"/>
      <stop offset="1" stop-color="#3a4552"/>
    </linearGradient>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8ff7f0"/>
      <stop offset="0.6" stop-color="#2fd3d0"/>
      <stop offset="1" stop-color="#0a4a55"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#d8ff8a"/>
      <stop offset="1" stop-color="#5a9e00"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="eye">
      <ellipse rx="1" ry="0.72" fill="#061015"/>
      <circle cx="0.06" cy="0.04" r="0.52" fill="url(#iris)"/>
      <circle cx="0.1" cy="0.08" r="0.24" fill="#03161c"/>
      <ellipse cx="-0.22" cy="-0.22" rx="0.2" ry="0.13" fill="#ffffff" opacity="0.95"/>
      <circle cx="0.3" cy="0.28" r="0.07" fill="#ffffff" opacity="0.7"/>
    </g>
  </defs>

  <!-- aura -->
  <circle cx="256" cy="290" r="250" fill="url(#aura)"/>

  <!-- antenna -->
  <path d="M256 118 C 262 84, 300 72, 316 44" fill="none" stroke="url(#chrome)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="318" cy="40" r="26" fill="#a6ff2e" opacity="0.45" filter="url(#soft)"/>
  <circle cx="318" cy="40" r="17" fill="url(#orb)"/>

  <!-- head: bulb with a pointed crown -->
  <path id="head" d="M256 112
           C 300 150, 410 200, 412 300
           C 414 380, 345 432, 256 432
           C 167 432, 98 380, 100 300
           C 102 200, 212 150, 256 112 Z" fill="url(#skin)"/>
  <path d="M256 112 C 300 150, 410 200, 412 300 C 414 380, 345 432, 256 432
           C 167 432, 98 380, 100 300 C 102 200, 212 150, 256 112 Z" fill="url(#rim)"/>
  <!-- gloss highlight -->
  <path d="M178 196 C 205 160, 245 140, 262 132 C 250 170, 214 210, 168 236 C 164 222, 168 208, 178 196 Z"
        fill="url(#gloss)" opacity="0.8"/>

  <!-- three eyes: two small upper, one big center -->
  <use href="#eye" transform="translate(196 252) scale(24) rotate(-14)"/>
  <use href="#eye" transform="translate(318 252) scale(24) rotate(14)"/>
  <use href="#eye" transform="translate(256 318) scale(50)"/>

  <!-- smirk -->
  <path d="M222 386 C 245 398, 280 396, 302 376" fill="none" stroke="#2a1655" stroke-width="7" stroke-linecap="round"/>
  <circle cx="304" cy="374" r="4" fill="#2a1655"/>

  <!-- chrome collar pod -->
  <path d="M142 410 C 170 450, 342 450, 370 410 C 392 430, 382 470, 256 476 C 130 470, 120 430, 142 410 Z"
        fill="url(#chrome)"/>
  <path d="M160 428 C 200 456, 312 456, 352 428" fill="none" stroke="#2fd3d0" stroke-width="4" opacity="0.9"/>
  <path d="M170 418 C 210 438, 302 438, 342 418" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
</svg>
