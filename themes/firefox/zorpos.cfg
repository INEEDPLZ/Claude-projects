// ZorpOS Firefox startup script (autoconfig). First line must be a comment.
// 1) Install the ZorpOS userChrome.css into the active profile (only if the user has none of their own).
// 2) Point new tabs at the ZorpOS alien new-tab page.
// Remove ~/.../chrome/.zorpos-managed to keep your own userChrome.css from being replaced on updates.
try {
  const { FileUtils } = ChromeUtils.importESModule("resource://gre/modules/FileUtils.sys.mjs");
  const profile = Services.dirsvc.get("ProfD", Ci.nsIFile);
  const chromeDir = profile.clone(); chromeDir.append("chrome");
  if (!chromeDir.exists()) chromeDir.create(Ci.nsIFile.DIRECTORY_TYPE, 0o755);
  const target = chromeDir.clone(); target.append("userChrome.css");
  const marker = chromeDir.clone(); marker.append(".zorpos-managed");
  const src = new FileUtils.File("/usr/share/zorpos/firefox/userChrome.css");
  if (src.exists() && (!target.exists() || marker.exists())) {
    if (target.exists()) target.remove(false);
    src.copyTo(chromeDir, "userChrome.css");
    if (!marker.exists()) marker.create(Ci.nsIFile.NORMAL_FILE_TYPE, 0o644);
  }
} catch (e) { Components.utils.reportError("ZorpOS userChrome install: " + e); }
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "file:///usr/share/zorpos/firefox/newtab/index.html";
} catch (e) { Components.utils.reportError("ZorpOS new tab: " + e); }
