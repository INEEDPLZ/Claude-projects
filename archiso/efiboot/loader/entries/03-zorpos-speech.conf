title    ZorpOS ~ with speech (screen reader)
sort-key 02a
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% @ZORP_VT@ console=ttyS0,115200 console=tty0 accessibility=on zorp.earthling=1
