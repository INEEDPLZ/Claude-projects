title    ZorpOS ~ LTS kernel, safe graphics (Earthling fallback)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% @ZORP_VT@ console=ttyS0,115200 console=tty0 nomodeset zorp.earthling=1
