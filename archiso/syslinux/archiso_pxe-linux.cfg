LABEL arch_nbd
TEXT HELP
Boot the ZorpOS live specimen using NBD.
It allows you to install ZorpOS or perform system maintenance.
ENDTEXT
MENU LABEL ZorpOS live specimen (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS% @ZORP_VT@
SYSAPPEND 3

