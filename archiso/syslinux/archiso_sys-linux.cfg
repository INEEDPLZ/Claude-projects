LABEL zorp
TEXT HELP
Board the mothership: ZorpOS live specimen on linux-zen.
ENDTEXT
MENU LABEL ZorpOS ~ board the mothership (linux-zen)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% @ZORP_VT@ console=ttyS0,115200 console=tty0

LABEL zorplts
TEXT HELP
Known-good fallback: linux-lts, nomodeset, Earthling Mode forced on.
ENDTEXT
MENU LABEL ZorpOS ~ LTS, safe graphics (Earthling)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% @ZORP_VT@ console=ttyS0,115200 console=tty0 nomodeset zorp.earthling=1

LABEL zorpspeech
TEXT HELP
Boot with the speakup screen reader. Earthling Mode forced on.
ENDTEXT
MENU LABEL ZorpOS ~ with ^speech (screen reader)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% @ZORP_VT@ console=ttyS0,115200 console=tty0 accessibility=on zorp.earthling=1
