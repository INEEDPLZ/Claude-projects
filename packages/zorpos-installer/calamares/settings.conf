# ZorpOS "Abduction Sequence" (Calamares)
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: zorp
  module: shellprocess
  config: shellprocess-zorp.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess@zorp
  - umount
- show:
  - finished

branding: abduction
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
