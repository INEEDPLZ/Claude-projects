# The ZorpOS-specific install steps (kernels, initramfs + splash, live cleanup, greeter, GPU, bootloader).
# Same script the CLI installer uses, so the automated test covers it.
dontChroot: true
timeout: 2400
script:
  - command: "/usr/bin/zorp-install-target ${ROOT}"
    timeout: 2400
i18n:
  name: "Preparing the specimen for life on Earth (kernels, splash, bootloader)"
