defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: false
    system: true
  - video
  - audio
  - input
  - games
  - rfkill
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
passwordRequirements:
  minLength: 1
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, specimen, greeter ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "mothership-${cpu}"
  forbidden_names: [ localhost ]
