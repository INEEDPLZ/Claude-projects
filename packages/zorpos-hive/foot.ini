# ZorpOS terminal colors (from tokens)
[main]
font=monospace:size=11
pad=12x12
[colors]
alpha=0.92
background=@VOID@
foreground=@TEXT@
regular0=@ABYSS@
regular1=@DANGER@
regular2=@ACID@
regular3=@WARN@
regular4=@GLASS_BLUE@
regular5=@ZORP_LILAC@
regular6=@AQUA@
regular7=@CHROME@
bright0=@CHROME_DARK@
bright1=@DANGER@
bright2=@ACID_GLOW@
bright3=@WARN@
bright4=@GLASS_BLUE@
bright5=@ZORP_LILAC@
bright6=@AQUA_GLOW@
bright7=@CHROME_HI@
