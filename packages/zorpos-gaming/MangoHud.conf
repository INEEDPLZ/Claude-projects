# ZorpOS "Vitals" overlay: dot-matrix teal LCD. System-wide default.
# Show it in a game:  mangohud %command%   (Steam launch options)  or  MANGOHUD=1
# Toggle while playing: Right Shift + F12.  Personal override: ~/.config/MangoHud/MangoHud.conf
legacy_layout=false
font_file=/usr/share/fonts/zorpos/Doto[ROND,wght].ttf
font_size=22
round_corners=14
position=top-left
toggle_hud=Shift_R+F12
background_alpha=0.45
background_color=@VOID@
text_color=@AQUA_GLOW@
text_outline=1
text_outline_color=@VOID@
gpu_text=GPU
cpu_text=CPU
gpu_color=@ACID@
cpu_color=@AQUA@
vram_color=@ZORP_LILAC@
ram_color=@ZORP_LILAC@
engine_color=@ACID@
io_color=@GLASS_BLUE@
frametime_color=@ACID@
fps_color_change
fps_value=30,60
fps_color=@DANGER@,@WARN@,@ACID@
gpu_load_change
gpu_load_color=@ACID@,@WARN@,@DANGER@
cpu_load_change
cpu_load_color=@AQUA@,@WARN@,@DANGER@
gpu_stats
gpu_temp
cpu_stats
cpu_temp
vram
ram
fps
frametime
frame_timing=1
gamemode
