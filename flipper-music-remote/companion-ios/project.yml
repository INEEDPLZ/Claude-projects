# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: FlipTune
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  FlipTune:
    type: application
    platform: iOS
    sources: [FlipTune]
    info:
      path: FlipTune/Info.plist
      properties:
        CFBundleDisplayName: FlipTune
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: FlipTune connects to your Flipper Zero to show what's playing and act as a remote.
        NSAppleMusicUsageDescription: FlipTune reads the current Apple Music track to show it on your Flipper Zero.
        UIBackgroundModes: [bluetooth-central]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fliptune
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Set your team here or pick it in Xcode > Signing & Capabilities
        DEVELOPMENT_TEAM: ""
