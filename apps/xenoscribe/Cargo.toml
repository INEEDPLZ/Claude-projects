[package]
name = "xenoscribe"
version = "0.4.0"
edition = "2021"
description = "Xenoscribe: the ZorpOS word processor. Documents are transmissions."
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_16"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
