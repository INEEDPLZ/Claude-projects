<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Xenoscribe: original icon. Chrome pod (the page) + glowing stylus. CC-BY-SA-4.0 -->
  <defs>
