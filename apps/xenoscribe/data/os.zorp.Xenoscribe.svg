      <stop offset="0" stop-color="#f4f8fb"/><stop offset="0.45" stop-color="#c4ced8"/>
      <stop offset="0.55" stop-color="#7d8a99"/><stop offset="1" stop-color="#3a4552"/>
    </linearGradient>
    <radialGradient id="glass" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#8ff7f0"/><stop offset="0.5" stop-color="#0f7f86"/><stop offset="1" stop-color="#03161c"/>
