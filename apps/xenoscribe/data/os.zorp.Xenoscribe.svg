    <rect x="31" y="82" width="30" height="5" rx="2.5"/><circle cx="68" cy="84" r="4"/>
  </g>
  <path d="M28 22 C 40 16, 70 15, 86 20 C 70 22, 44 26, 28 34 Z" fill="#fff" opacity="0.45"/>
